<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0a0a0b">
<title>Plate Book · Chulele Añejo pitch</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="/bottle3d/bottle3d.css?v=BQgvOZWf">
<style>
/* PITCH 6 · Plate Book (London). Idea: a bound distillery book. Real 3D page turns, engraved plates drawn line by line. No photography at all. */
:root{--sw:26%;--paper:#ece4d2;--ink:#241e14;--pw:min(33vw,52vh);--ph:min(74vh,calc(var(--pw)*1.34))}
.stage{background:radial-gradient(ellipse 70% 55% at 50% 52%,rgba(175,0,97,.25),transparent 70%)}
.wrap{position:relative;height:950vh}.pin{position:sticky;top:0;height:100vh;margin-left:var(--sw);display:flex;align-items:center;justify-content:center;perspective:2600px;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#16120d,#0a0a0b 70%)}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);transform-style:preserve-3d;transform:rotateX(8deg) rotateZ(-.8deg)}
.book::before{content:"";position:absolute;left:-14px;right:-14px;top:-12px;bottom:-12px;background:linear-gradient(#3a2418,#2a180f);border-radius:4px;box-shadow:0 50px 90px rgba(0,0,0,.8);transform:translateZ(-6px)}
.leaf{position:absolute;left:50%;top:0;width:var(--pw);height:var(--ph);transform-origin:0 50%;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);color:var(--ink);padding:clamp(18px,2.4vw,40px);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.face::before{content:"";position:absolute;inset:8px;border:1px solid rgba(36,30,20,.35);pointer-events:none}
.front{background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 8%,transparent),var(--paper)}.back{transform:rotateY(180deg);background:linear-gradient(270deg,rgba(0,0,0,.18),transparent 8%,transparent),var(--paper);align-items:center;justify-content:center}
.face h2{font-size:clamp(26px,3vw,48px);line-height:.96;text-transform:uppercase;letter-spacing:.02em}.face p{margin:0;font:400 clamp(12px,1.05vw,15px)/1.6 Georgia,'Times New Roman',serif;color:#2c261b}
.face .k{font:600 10px var(--fd);letter-spacing:.26em;text-transform:uppercase;color:#7a6a45}.face .pn{margin-top:auto;font:600 10px var(--fd);letter-spacing:.2em;color:#7a6a45;text-align:center}
.face .big{font:700 clamp(70px,9vw,150px)/.8 var(--fd);text-transform:uppercase}.face svg{width:100%;height:100%}
.pl{stroke:#241e14;fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}.pl.f{fill:rgba(36,30,20,.1)}.pl.g{stroke:#8a6a2a}
.face .cta{align-self:flex-start;font-size:12px;padding:12px 22px}.face .lx{font:600 9.5px var(--fd);letter-spacing:.26em;text-transform:uppercase;color:#7a6a45}
.cap{position:absolute;left:0;right:0;bottom:3vh;text-align:center;font:600 11px var(--fd);letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
@media(max-width:899px){:root{--band:37svh;--pw:min(44vw,44vh);--ph:min(calc(100svh - var(--band) - 28px),calc(var(--pw)*1.5))}.pin{margin-left:0;margin-top:var(--band);height:calc(100svh - var(--band))}.wrap{height:820vh}.face{padding:12px;gap:6px}.face h2{font-size:21px}.face p{font-size:10.5px;line-height:1.45}.face .big{font-size:20vw}.cap{display:none}}
</style></head><body data-id="book">
<div class="stage"><div class="b3d" data-bottle3d="ddm-joven-black" style="--b3d-glow:175,0,97;--b3d-mark:url(/assets/mockup/bottle3d-shape-ddm.png)"><img src="../img/bottle.webp" width="352" height="898" alt="Chulele bottle (3D model stand-in)"></div></div>
<div class="wrap" id="wrap"><div class="pin"><div class="book" id="book"></div><div class="cap">Scroll to turn the page</div></div></div>
<script src="../vendor/gsap.min.js"></script><script src="../vendor/ScrollTrigger.min.js"></script><script src="../vendor/lenis.min.js"></script>
<script type="module" src="/bottle3d/bottle3d-tilt1.js"></script>
<script src="../common.js"></script>
<script>(()=>{
// engraved plates, drawn as SVG strokes
const rays=(cx,cy,r1,r2,n)=>Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2;return `<line class="pl g" x1="${cx+r1*Math.cos(a)}" y1="${cy+r1*Math.sin(a)}" x2="${cx+r2*Math.cos(a)}" y2="${cy+r2*Math.sin(a)}"/>`}).join('');
const hatch=(x,y,w,h,n)=>Array.from({length:n},(_,i)=>`<line class="pl" x1="${x}" y1="${y+i*h/n}" x2="${x+w}" y2="${y+i*h/n-10}" opacity=".35"/>`).join('');
const PL={
agave:`<svg viewBox="0 0 300 400">${rays(150,150,50,90,28)}<g transform="translate(150,300)">${Array.from({length:13},(_,i)=>{const a=-95+i*15.8;return `<g transform="rotate(${a})"><path class="pl f" d="M0 0 Q16 -80 0 -170 Q-16 -80 0 0Z"/><path class="pl" d="M0 -10 L0 -150"/>${[40,70,100,130].map(y=>`<path class="pl" d="M0 -${y} l8 -8 M0 -${y} l-8 -8" opacity=".6"/>`).join('')}</g>`}).join('')}</g><path class="pl" d="M20 330 Q150 316 280 330 M40 342 Q150 330 260 342 M70 354 Q150 346 230 354"/><text x="150" y="384" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#241e14" letter-spacing="3">AGAVE ESPADÍN</text></svg>`,
oven:`<svg viewBox="0 0 300 400"><path class="pl" d="M30 300 Q30 120 150 120 Q270 120 270 300"/><path class="pl f" d="M60 300 Q60 160 150 160 Q240 160 240 300Z"/>${Array.from({length:22},(_,i)=>{const a=Math.PI+i/21*Math.PI;return `<circle class="pl" cx="${150+118*Math.cos(a)}" cy="${300+170*Math.sin(a)}" r="${7+(i%3)*2}"/>`}).join('')}<path class="pl g" d="M120 300 Q110 250 130 220 Q125 250 150 240 Q140 200 160 170 Q170 220 190 240 Q200 260 180 300Z"/><path class="pl g" d="M130 300 Q135 270 150 260 Q165 270 170 300"/><path class="pl" d="M150 110 Q140 80 155 55 Q170 30 150 8 M175 118 Q168 90 180 70 Q192 48 176 28" opacity=".6"/>${hatch(40,300,220,50,10)}<text x="150" y="384" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#241e14" letter-spacing="3">THE PIT OVEN</text></svg>`,
tahona:`<svg viewBox="0 0 300 400"><circle class="pl f" cx="150" cy="210" r="104"/><circle class="pl" cx="150" cy="210" r="96"/><circle class="pl" cx="150" cy="210" r="20"/>${Array.from({length:12},(_,i)=>{const a=i/12*Math.PI*2;return `<line class="pl" x1="${150+20*Math.cos(a)}" y1="${210+20*Math.sin(a)}" x2="${150+96*Math.cos(a)}" y2="${210+96*Math.sin(a)}" opacity=".5"/>`}).join('')}<path class="pl g" d="M150 210 L290 120 M150 210 L290 125"/><ellipse class="pl" cx="150" cy="330" rx="130" ry="22"/><path class="pl" d="M20 330 Q150 360 280 330" opacity=".6"/>${hatch(30,320,240,36,8)}<text x="150" y="384" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#241e14" letter-spacing="3">THE TAHONA</text></svg>`,
still:`<svg viewBox="0 0 300 400"><ellipse class="pl f" cx="110" cy="270" rx="78" ry="70"/><path class="pl" d="M80 210 Q80 150 108 120 Q116 112 116 100 L116 84 Q116 78 122 78 Q128 78 128 84 L128 100 Q130 112 140 120 Q160 150 160 210"/><path class="pl g" d="M122 78 Q180 40 240 70 Q262 84 262 120 L262 330"/><path class="pl" d="M236 140 Q262 140 262 162 Q262 184 236 184 Q262 184 262 206 Q262 228 236 228 Q262 228 262 250 Q262 272 236 272"/><path class="pl" d="M40 340 L180 340 M60 322 L160 322" /><path class="pl g" d="M70 322 Q80 300 70 282 Q90 290 96 270 Q104 292 120 300 Q108 316 120 322"/>${hatch(40,200,140,130,14)}<text x="150" y="384" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#241e14" letter-spacing="3">THE COPPER STILL</text></svg>`,
barrel:`<svg viewBox="0 0 300 400"><path class="pl f" d="M60 120 Q20 200 60 290 L240 290 Q280 200 240 120Z"/><ellipse class="pl" cx="150" cy="120" rx="90" ry="22"/><ellipse class="pl" cx="150" cy="290" rx="90" ry="22" />${[150,175,200,225,250].map(y=>`<path class="pl g" d="M${50+(y-120)*.02} ${y} Q150 ${y+22} ${250-(y-120)*.02} ${y}"/>`).join('')}${Array.from({length:9},(_,i)=>`<path class="pl" d="M${64+i*21} 125 Q${54+i*21} 205 ${64+i*21} 288" opacity=".5"/>`).join('')}<text x="150" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#241e14" letter-spacing="3">No. 003</text><text x="150" y="234" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#241e14" letter-spacing="2">DEC 2022</text><path class="pl" d="M30 330 L270 330 M50 344 L250 344" opacity=".6"/><text x="150" y="384" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#241e14" letter-spacing="3">CALIFORNIA OAK</text></svg>`,
five:`<svg viewBox="0 0 300 400"><circle class="pl g" cx="150" cy="190" r="120"/><circle class="pl" cx="150" cy="190" r="108" stroke-dasharray="2 5"/>${Array.from({length:60},(_,i)=>{const a=i/60*Math.PI*2-Math.PI/2,L=i%12===0?14:5;return `<line class="pl" x1="${150+120*Math.cos(a)}" y1="${190+120*Math.sin(a)}" x2="${150+(120+L)*Math.cos(a)}" y2="${190+(120+L)*Math.sin(a)}"/>`}).join('')}<text x="150" y="230" text-anchor="middle" font-family="Akrobat,Barlow Condensed,sans-serif" font-weight="700" font-size="140" fill="none" stroke="#241e14" stroke-width="1.2">5</text><text x="150" y="384" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#241e14" letter-spacing="3">AÑOS · IN RESERVE</text></svg>`};
const T=[
 `<div class="k">The Reserve · No. 003</div><div class="big">Añejo</div><p>Día de los Muertos, 2022. Espadín mezcal, aged in California oak since December 2022 in Santiago Matatlán, Oaxaca.</p><p class="lx">Premium luxury spirit · Premium luxury brand</p><div class="pn">i</div>`,
 `<div class="k">Chapter I · 25 October 2022</div><h2>The harvest</h2><p>Before eight in the morning, in the fields of Benito Ruiz and his son Francisco, about 150 espadín agave were cut by hand, finishing before the afternoon sun. A high of 84°F.</p><div class="pn">1</div>`,
 `<div class="k">Chapter II · 28 – 31 October</div><h2>Fire and stone</h2><p>A pit oven lit around six in the morning and covered in volcanic rock. Four days of slow cooking. When the soil came off on the 31st, the night had fallen to 46°F.</p><div class="pn">2</div>`,
 `<div class="k">Chapter III · 1 – 9 November</div><h2>Stone, horse and wild yeast</h2><p>Israel and Isabella the horse turned the tahona for four hours. Then seven days of wild fermentation, while marigold and cockscomb dressed every altar nearby.</p><div class="pn">3</div>`,
 `<div class="k">Chapter IV · 9 &amp; 23 November</div><h2>Twice through copper</h2><p>Luis Jímenez, our mezcal formulator, tested the vats on the 9th. Copper stills sealed with barro clay and fired with wood. After the second run the spirit passed 53%.</p><div class="pn">4</div>`,
 `<div class="k">Chapter V · December 2022</div><h2>Laid in oak</h2><p>Part of the batch was set apart and laid into California oak. It has not left the barrel since. Expected: oak, vanilla, dried fruit, a whisper of smoke.</p><div class="pn">5</div>`,
 `<div class="k">The Reserve List</div><h2>Be there when the cask opens</h2><p>One release, by invitation. Suggested retail $249. Leave your name to be told first.</p><a class="cta" href="${C.RES}">Join the reserve list →</a><a class="lx" data-film href="https://vimeo.com/883190665" target="_blank" rel="noopener" style="text-decoration:underline">Watch the documentary</a><div class="pn">6</div>`];
const P=['agave','oven','tahona','still','barrel','five'];
const book=document.getElementById('book'),leaves=[];
T.forEach((t,i)=>{const l=document.createElement('div');l.className='leaf';l.innerHTML=`<div class="face front">${t}</div><div class="face back">${P[i]?PL[P[i]]:''}</div>`;book.append(l);leaves.push(l)});
const n=leaves.length-1; // last leaf stays open on the right (it is the final page)
function upd(p){const q=p*n;leaves.forEach((l,i)=>{const t=Math.max(0,Math.min(1,q-i)),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,ang=i<n?-180*e:0;l.style.transform=`rotateY(${ang}deg)`;l.style.zIndex=ang<-90?(i+1):(leaves.length-i)});
 const open=Math.min(1,q),pw=book.offsetWidth/2;book.style.marginLeft=(-(1-open)*pw)+'px'}
// plate "engraving" draw-on
function draw(){document.querySelectorAll('.back .pl').forEach(el=>{try{const L=el.getTotalLength();el.style.strokeDasharray=L;el.style.strokeDashoffset=L}catch(e){}})}
if(C.RM){upd(.0)}else{ScrollTrigger.create({trigger:'#wrap',start:'top top',end:'bottom bottom',scrub:.6,onUpdate:s=>{upd(s.progress);
  const q=s.progress*n;leaves.forEach((l,i)=>{const e=Math.max(0,Math.min(1,(q-i-.35)/.5));l.querySelectorAll('.back .pl').forEach(el=>{if(el.__L===undefined){try{el.__L=el.getTotalLength()}catch(x){el.__L=0}el.style.strokeDasharray=el.__L}el.style.strokeDashoffset=el.__L*(1-e)})})}});upd(0);}
})();</script></body></html>
