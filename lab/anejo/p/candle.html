<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0a0a0b">
<title>Candle · Chulele Añejo pitch</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="/bottle3d/bottle3d.css?v=BQgvOZWf">
<style>
/* PITCH 9 · Candle (Mexico City). Idea: a dark cellar and one flame. The visitor carries the light (cursor or finger); scrolling walks deeper into the cellar. Nothing is visible unless you light it. */
:root{--sw:28%}
body{background:#050304}
.stage{background:radial-gradient(ellipse 70% 55% at 50% 52%,rgba(175,0,97,.25),transparent 70%);z-index:34}
.cave{position:relative;margin-left:var(--sw);height:430vh;background:radial-gradient(ellipse at 50% 20%,#14090c,#050304 60%)}
.it{position:absolute}.it.img img{width:100%;display:block;filter:contrast(1.08) saturate(1.05)}.it.img span{position:absolute;left:8px;bottom:6px;font:600 10px var(--fd);letter-spacing:.22em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px #000}
.it.t{max-width:min(380px,32vw)}.it.t .d{font:600 12px var(--fd);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}.it.t h2{font-size:clamp(34px,4.6vw,76px);line-height:.94;text-transform:uppercase;margin:6px 0 8px}.it.t p{margin:0;font-size:clamp(14px,1.2vw,17px);color:#e2d9cb}
.it.big{font:700 clamp(120px,22vw,380px)/.8 var(--fd);color:transparent;-webkit-text-stroke:1px rgba(224,160,48,.55)}
.dark{position:fixed;left:var(--sw);right:0;top:0;bottom:0;z-index:20;pointer-events:none;background:radial-gradient(circle var(--r,260px) at var(--x,60%) var(--y,50%),rgba(0,0,0,0) 0%,rgba(0,0,0,.2) 38%,rgba(0,0,0,.84) 78%,rgba(0,0,0,.94) 100%)}
.glow{position:fixed;left:var(--sw);right:0;top:0;bottom:0;z-index:21;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle calc(var(--r,260px)*.75) at var(--x,60%) var(--y,50%),rgba(255,160,70,.2),transparent 70%)}
.flame{position:fixed;z-index:22;left:0;top:0;width:14px;height:26px;margin:-26px 0 0 -7px;pointer-events:none;transform:translate(var(--fx,60vw),var(--fy,50vh));filter:drop-shadow(0 0 14px #ffa040)}
.flame i{display:block;width:100%;height:100%;background:radial-gradient(ellipse at 50% 70%,#fff3c4 0,#ffb347 45%,rgba(255,120,30,0) 72%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;animation:fk .16s ease-in-out infinite alternate}@keyframes fk{from{transform:scale(1,1)}to{transform:scale(.9,1.12)}}
.hint{position:fixed;z-index:23;left:calc(var(--sw) + 3vw);bottom:4vh;font:600 11px var(--fd);letter-spacing:.3em;text-transform:uppercase;color:#a89572;transition:opacity .6s}
.always{position:absolute;z-index:30;left:calc(5% );bottom:7vh}.always .cta{display:inline-block}.always .lux{display:block;margin-top:10px}
@media(max-width:899px){:root{--band:37svh}.cave{margin-left:0;padding-top:var(--band);height:520vh}.dark,.glow{left:0;top:var(--band)}.hint{left:14px;bottom:2vh}.it.t{max-width:78vw}.it.t h2{font-size:34px}.it.big{font-size:44vw}}
</style></head><body data-id="candle">
<div class="stage"><div class="b3d" data-bottle3d="ddm-joven-black" style="--b3d-glow:175,0,97;--b3d-mark:url(/assets/mockup/bottle3d-shape-ddm.png)"><img src="../img/bottle.webp" width="352" height="898" alt="Chulele bottle (3D model stand-in)"></div></div>
<main class="cave" id="cave"></main>
<div class="dark" id="dark"></div><div class="glow" id="glow"></div><div class="flame" id="flame"><i></i></div><div class="hint" id="hint">Move the light · scroll to go deeper</div>
<script src="../vendor/gsap.min.js"></script><script src="../vendor/ScrollTrigger.min.js"></script><script src="../vendor/lenis.min.js"></script>
<script type="module" src="/bottle3d/bottle3d-tilt1.js"></script>
<script src="../common.js"></script>
<script>(()=>{
const cave=document.getElementById('cave');
// items positioned in % of cave width/height
const I=[
['t',8,3,'Día de los Muertos · 2022','Light a candle','The Reserve · No. 003. A premium luxury spirit from a premium luxury brand, resting in the dark.'],
['img',48,6,'harvest','25 Oct 2022',30],['t',10,17,'25 October 2022','The first cut','About 150 espadín agave, by hand, in the fields of Benito Ruiz and his son Francisco.'],
['img',58,24,'smoke','The oven',32],['t',6,30,'28 – 31 October','Four days of fire','Volcanic stone and slow heat. Night low 46°F when it was opened.'],
['big',52,38,'53%'],['t',14,43,'9 & 23 November','Twice through copper','Clay-sealed stills over a wood fire. Above 53% ABV off the second distillation.'],
['img',8,49,'flowers','Marigold & cockscomb',30],['img',60,53,'altar','The ofrenda',26],['t',46,60,'The week it was made','The dead are the guests of honor','Oaxaca after three years of waiting. This spirit was made in the middle of it.'],
['img',10,66,'cemetery','The panteón',38],['t',54,76,'December 2022','Then, oak','Part of the batch was laid in California oak in Santiago Matatlán. It has not left the barrel since.'],
['big',8,83,'5'],['t',42,86,'Held in reserve','Five years. One release.','By invitation, once. Suggested retail $249.']];
I.forEach(a=>{const e=document.createElement('div');if(a[0]==='t'){e.className='it t';e.style.left=a[1]+'%';e.style.top=a[2]+'%';e.innerHTML=`<div class="d">${a[3]}</div><h2>${a[4]}</h2><p>${a[5]}</p>`}
 else if(a[0]==='img'){e.className='it img';e.style.left=a[1]+'%';e.style.top=a[2]+'%';e.style.width=a[5]+'%';e.innerHTML=`<img src="../img/${a[3]}.webp" alt=""><span>${a[4]}</span>`}
 else{e.className='it big';e.style.left=a[1]+'%';e.style.top=a[2]+'%';e.textContent=a[3]}cave.append(e)});
const al=document.createElement('div');al.className='always';al.innerHTML=`<a class="cta" href="${C.RES}">Join the reserve list →</a><a class="lux" data-film style="text-decoration:underline" href="https://vimeo.com/883190665" target="_blank" rel="noopener">Watch the documentary</a>`;al.style.left='42%';al.style.top='94%';cave.append(al);
// the light
const dark=document.getElementById('dark'),glow=document.getElementById('glow'),flame=document.getElementById('flame'),hint=document.getElementById('hint');
const items=[...document.querySelectorAll('.it')];let px=null,py=null,tx=0,ty=0,x=0,y=0,t0=performance.now(),last=0;const area=()=>({l:innerWidth<900?0:innerWidth*.28,t:innerWidth<900?innerHeight*.37:0});
function setT(cx,cy){px=cx;py=cy;last=performance.now()}
addEventListener('pointermove',e=>setT(e.clientX,e.clientY));addEventListener('touchmove',e=>{const t=e.touches[0];setT(t.clientX,t.clientY)},{passive:true});
if(C.RM){dark.style.background='none';glow.style.display='none';flame.style.display='none';hint.style.display='none'}else{
(function loop(now){requestAnimationFrame(loop);const A=area(),w=innerWidth-A.l,h=innerHeight-A.t;
 if(px==null||now-last>2200){let best=null,bd=1e9;items.forEach(e=>{const r=e.getBoundingClientRect(),cy=r.top+r.height/2;if(r.bottom<A.t||r.top>innerHeight)return;const d=Math.abs(cy-(A.t+h*.5));if(d<bd){bd=d;best=r}});const s=now/1000;if(best){tx=best.left+best.width/2+Math.sin(s*.8)*20;ty=best.top+Math.min(best.height,300)/2+Math.cos(s*.7)*14}else{tx=A.l+w*(.5+.3*Math.sin(s*.41));ty=A.t+h*(.5+.25*Math.sin(s*.57+1))}}else{tx=px;ty=py}
 x+=(tx-x)*.12;y+=(ty-y)*.12;const fl=1+Math.sin(now*.011)*.025+Math.sin(now*.027)*.02,r=(innerWidth<900?230:400)*fl;
 dark.style.setProperty('--x',(x-A.l)+'px');dark.style.setProperty('--y',(y-A.t)+'px');dark.style.setProperty('--r',r+'px');glow.style.setProperty('--x',(x-A.l)+'px');glow.style.setProperty('--y',(y-A.t)+'px');glow.style.setProperty('--r',r+'px');
 flame.style.setProperty('--fx',x+'px');flame.style.setProperty('--fy',y+'px');hint.style.opacity=scrollY>innerHeight*.6?0:1})(0)}
// parallax depth: items drift slightly on scroll
if(!C.RM)document.querySelectorAll('.it.img').forEach((e,i)=>gsap.fromTo(e,{y:60},{y:-60,ease:'none',scrollTrigger:{trigger:e,start:'top bottom',end:'bottom top',scrub:true}}));
})();</script></body></html>
