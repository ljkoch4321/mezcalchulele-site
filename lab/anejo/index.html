<style>

.disp,h1,h2,.kick,.eyebrow,.cta,.status,.price,.stat b,.sw,.cue,.big,.luxe,.chips span,.cap{font-family:var(--fd);font-weight:600}
a{color:inherit}

.grain{position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:gr 1.2s steps(6) infinite}
@keyframes gr{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

.sw button[aria-pressed=true]{background:var(--bone);color:var(--ink)}

 background:radial-gradient(ellipse 70% 58% at 50% 54%,rgba(var(--gr),var(--gg),var(--gb),var(--ga)),transparent 70%);transition:--gr .9s,--gg .9s,--gb .9s,--ga .9s}

.cbg{position:absolute;inset:0;z-index:5}.cbg img{width:100%;height:100%;object-fit:cover;opacity:.9;filter:saturate(.9) brightness(.55)}.cbg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 20%,var(--ink) 85%)}
.ci{position:absolute;z-index:40;left:calc(40% + clamp(24px,4vw,72px));right:max(28px,5vw);top:50%;transform:translateY(-50%);max-width:620px;display:flex;flex-direction:column;gap:16px;opacity:0}
.eyebrow{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}

/* people */
.maestro{display:flex;align-items:center;gap:14px;margin-top:10px}.maestro img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--gold)}.maestro b{display:block;font:600 16px var(--fd);letter-spacing:.14em;text-transform:uppercase}.maestro span{font-size:13px;color:var(--dim)}

 .stage{width:100%;height:var(--top);bottom:auto;z-index:60;background:radial-gradient(ellipse 80% 72% at 50% 60%,rgba(var(--gr),var(--gg),var(--gb),var(--ga)),transparent 72%),var(--ink);box-shadow:0 18px 26px -12px var(--ink);padding-top:calc(46px + env(safe-area-inset-top,0px))}
